<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line School</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./imports.css">
    <script src="./js/app.js" defer type="module"></script>
</head>
<body>
    <header>
        <div class="lion">
            <img src="./img/logo-image.png" alt="Logo com um leão dentro">
            <span>Lion School</span>
        </div>
        <div class="sair" id="sair">
            <img src="./img/sair.svg" alt="Imagem onde pode sair">
            <p>Sair</p>
        </div>
    </header>
    <main id="main">

    </main>
    <footer>
        <div class="contatos">
            <div class="telefone">
                <img src="./img/telefone.svg" alt="Icone de telefone">
                <p>(11) 4774-4700</p>
            </div>
            <div class="email">
                <img src="./img/icon-email.svg" alt="Icon de email">
                <p>lionschool@gmail.com</p>
            </div>
            <div class="rua">
                <img src="./img/local.svg" alt="icon de local">
                <p>Rua tcc, 211,  Centro, Jandira</p>
            </div>
        </div>
        <div class="copy">
            <p>Copyright © 2026 | Fernando Leonid</p>
        </div>
        <div class="redeSocial">
            <div>
                <img src="./img/youtube.svg" alt="Icon de youtube">
            </div>
            <div>
                <img src="./img/twiter.svg" alt="Icon do passarinho">
            </div>
            <div>
                <img src="./img/instagran.svg" alt="icon do instagram">
            </div>
            <div>
                <img src="./img/fecebook.svg" alt="Icon do facebook">
            </div>
        </div>
    </footer>
</body>
</html>
